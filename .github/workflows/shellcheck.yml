name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck payloads
        # payload.txt is Bash. SC2140: payloads intentionally join quoted XML strings across lines.
        # SC2059: the built-in zip writer builds binary headers with printf on purpose.
        run: |
          find payloads -name payload.txt -print0 | \
            xargs -0 shellcheck -s bash -S warning -e SC2034,SC2155,SC2140,SC2059
